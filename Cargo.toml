[workspace]
resolver = "2"
members = ["crates/cortexkit-mutate", "crates/cortexkit-paths", "crates/cortexkit-lease", "crates/cortexkit-store-types", "crates/cortexkit-store", "crates/cortexkit-store-postgres", "crates/cortexkit-cache-core", "crates/cortexkit-model-catalog", "crates/cortexkit-provider-usage", "crates/cortexkit-push-seal", "crates/cortexkit-log", "crates/cortexkit-bus-trait", "crates/cortexkit-bus-inmemory", "crates/cortexkit-bus-naming", "crates/cortexkit-bus-nats", "crates/cortexkit-role-harness", "crates/cortexkit-role-tool-provider", "crates/cortexkit-role-tool-display", "crates/cortexkit-role-tool-provider-conformance", "crates/cortexkit-role-llm-runner", "crates/cortexkit-role-llm-runner-conformance", "crates/cortexkit-model-batch", "crates/cortexkit-llm-tools", "crates/cortexkit-role-classifier", "crates/cortexkit-role-classifier-conformance", "crates/cortexkit-role-routing", "crates/cortexkit-role-routing-conformance", "crates/cortexkit-role-extractor", "crates/cortexkit-role-extractor-conformance", "crates/cortexkit-role-compaction-provider", "crates/cortexkit-role-compaction", "crates/cortexkit-compaction-view", "crates/cortexkit-compaction-view-wasm", "crates/cortexkit-role-step-transform-provider", "crates/cortexkit-role-agent-data", "crates/cortexkit-role-agent-inbox", "crates/cortexkit-role-agent-inbox-conformance", "crates/cortexkit-resource-busy", "crates/cortexkit-exec-remote-types", "crates/cortexkit-cow", "crates/cortexkit-test-support", "crates/cortexkit-anthropic-policy", "crates/cortexkit-chatgpt-policy", "crates/cortexkit-rich-ui-syntax", "crates/cortexkit-persona", "crates/cortexkit-usage-steps", "crates/cortexkit-project-identity", "crates/cortexkit-agent-identity", "crates/cortexkit-presence"]
exclude = ["third_party/tryhard"]

# cortexkit/commons — neutral home for cross-product CortexKit primitives.
# Each crate is published independently to crates.io; product repositories
# depend on the published version (or a sibling path-dep for local development).
[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/cortexkit/commons"
authors = ["Ufuk Altinok"]

# The previous compaction contract (cortexkit-role-compaction-provider) still
# builds against the published llm-runner 0.7 line, which depends on
# cortexkit-rich-ui-syntax from crates.io. Without this patch the workspace
# would hold two identical 0.3.0 copies of that crate, and `cargo -p
# cortexkit-rich-ui-syntax` would refuse as ambiguous. The path copy matches
# the published 0.3.0. If the path crate moves to an incompatible version,
# Cargo stops applying this patch and the two copies differ by version.
[patch.crates-io]
cortexkit-rich-ui-syntax = { path = "crates/cortexkit-rich-ui-syntax" }
