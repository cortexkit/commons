[package]
name = "cortexkit-role-tool-display"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Wire shapes and validators for provider-authored tool-display/v1 data."
publish = true
include = ["Cargo.toml", "CONTRACT.md", "CHANGELOG.md", "README.md", "src/**", "tests/**", "test-vectors/**"]

[features]
test-vectors = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
subc-protocol = "0.34.1"
url = "2.5.8"
