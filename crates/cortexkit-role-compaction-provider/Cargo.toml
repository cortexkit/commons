# cortexkit-role-compaction-provider — the wire contract of the
# `compaction-provider/v1` role: role.describe, Setup, advance notices, views
# and `view.get`, `compaction.ride`, the ceiling policy, error codes, the
# kill-point vocabulary its crash suite will use, and CONTRACT.md, which
# states every rule as pinned. Pure serde plus small checks; no transport, no
# runtime.
#
# These production wire types do not depend on a conformance harness or suite.
[package]
name = "cortexkit-role-compaction-provider"
version = "0.7.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Wire contract of the CortexKit compaction-provider/v1 role: Setup, advance notices, views and view.get, compaction.ride and the ceiling policy."
publish = true

[features]
conformance = []
test-vectors = []

[[test]]
name = "vectors_feature"
required-features = ["test-vectors"]

[dependencies]
# The runner role's crate, for the names and types both sides of the
# interface share, so they cannot drift apart.
cortexkit-role-llm-runner = { version = "0.7.4", path = "../cortexkit-role-llm-runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
