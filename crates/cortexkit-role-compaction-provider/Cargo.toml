# cortexkit-role-compaction-provider — the wire contract of the
# `compaction-provider/v1` role: role.describe, Setup, the per-step status,
# the four answers (NOOP, CompactionMessage, WAIT, REFUSE), the request fence,
# `compaction.ready`, error codes, the kill-point vocabulary its crash suite
# will use, and CONTRACT.md, which states every rule as pinned. Pure serde
# plus small checks; no transport, no runtime.
#
# Not yet published to crates.io: consumers depend on it by git commit until
# its first release. The conformance runner will live in a sibling
# `-conformance` crate, so a provider's production build never pulls in the
# suite.
[package]
name = "cortexkit-role-compaction-provider"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Wire contract of the CortexKit compaction-provider/v1 role: Setup, the per-step status, CompactionMessage, WAIT, REFUSE, the request fence and compaction.ready."
publish = false

[dependencies]
# The runner role's crate, for the names and types both sides of the
# interface share, so they cannot drift apart.
cortexkit-role-llm-runner = { version = "0.1.0", path = "../cortexkit-role-llm-runner" }
cortexkit-role-step-transform-provider = { version = "0.1.2", path = "../cortexkit-role-step-transform-provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"
