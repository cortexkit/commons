# cortexkit-role-llm-runner-conformance — the `llm-runner/v1` conformance
# runner. It drives a LIVE runner over its real management route, reached
# through the runner's `cortexkit-role-harness` implementation, with a
# scripted model and a scripted tool provider the runner's own CI wires in,
# and checks every reply against the role crate's wire types. A runner adds
# this crate as a dev-dependency; it is a separate crate so a runner's
# production build never compiles the suite.
[package]
name = "cortexkit-role-llm-runner-conformance"
version = "0.12.7"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Conformance runner for the CortexKit llm-runner/v1 role: drives a live runner through its crash-cut harness with a scripted model and checks its wire replies."
publish = true

[dependencies]
base64 = "0.22"
async-trait = "0.1"
cortexkit-role-harness = { version = "0.1.0", path = "../cortexkit-role-harness" }
cortexkit-role-compaction-provider = { version = "0.6.0", path = "../cortexkit-role-compaction-provider" }
cortexkit-role-llm-runner = { version = "0.6.6", path = "../cortexkit-role-llm-runner" }
cortexkit-rich-ui-syntax = { version = "0.3.0", path = "../cortexkit-rich-ui-syntax", features = ["test-vectors"] }
futures-util = { version = "0.3", default-features = false }
serde = "1"
serde_json = "1"
subc-protocol = "0.33"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
getrandom = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }
