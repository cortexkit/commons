# cortexkit-role-classifier — the wire contract of the `classifier/v1` role:
# role.describe, classify.run, the providers' shared question and answer
# shapes, the batch body identity, error codes and their classes, request
# validators, and CONTRACT.md, which says what is pinned. The batch rules it
# shares with the other model-batch roles come from cortexkit-model-batch.
# Pure serde plus small checks; no transport, no runtime.
#
# The conformance suite lives in the sibling `-conformance` crate, so a
# runner's production build never pulls in the suite.
[package]
name = "cortexkit-role-classifier"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Wire contract of the CortexKit classifier/v1 role: role.describe, classify.run, question and answer shapes, batch identity and error codes."
publish = true
# Ship the shared vector files with the crate so the optional `vectors` module
# works for consumers who install this package without a repository checkout.
include = ["Cargo.toml", "CONTRACT.md", "CHANGELOG.md", "README.md", "src/**", "tests/**", "test-vectors/**"]

[features]
# Compiles the shared vectors into the public `vectors` module.
test-vectors = []

[dependencies]
# The batch rules classifier/v1 shares with the other model-batch roles; its
# items are re-exported at their classifier paths.
cortexkit-model-batch = { version = "0.3.0", path = "../cortexkit-model-batch" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"
subc-protocol = "0.33"

[[test]]
name = "vectors"
required-features = ["test-vectors"]

[[test]]
name = "vectors_feature"
required-features = ["test-vectors"]
