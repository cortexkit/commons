[package]
name = "cortexkit-role-compaction"
version = "0.4.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Wire contract for compaction-provider/v2 and compaction-runner/v1"
readme = "README.md"

[dependencies]
cortexkit-role-llm-runner = { version = "0.8.35", path = "../cortexkit-role-llm-runner" }
serde = { version = "1", features = ["derive"] }
# raw_value: tool input is written verbatim from its text. float_roundtrip: a
# value's text parses back to the same value, so digests computed from the
# text equal those computed from the value.
serde_jcs = "0.2"
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
serde_path_to_error = "0.1"
sha2 = "0.10"
