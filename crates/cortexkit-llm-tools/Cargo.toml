[package]
name = "cortexkit-llm-tools"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared wire contracts, schemas and validation for CortexKit's single-call LLM tools."
publish = true
include = ["Cargo.toml", "README.md", "CONTRACT.md", "src/**", "tests/**", "test-vectors/**"]

[features]
test-vectors = []

[dependencies]
cortexkit-model-batch = { version = "0.3.1", path = "../cortexkit-model-batch" }
cortexkit-role-classifier = { version = "0.5.0", path = "../cortexkit-role-classifier" }
cortexkit-role-extractor = { version = "0.2.0", path = "../cortexkit-role-extractor" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
sha2 = "0.10"

[[test]]
name = "vectors"
required-features = ["test-vectors"]
