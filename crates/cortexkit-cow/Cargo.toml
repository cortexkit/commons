[package]
name = "cortexkit-cow"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cross-platform copy-on-write workspace isolation and change capture."
readme = "README.md"
publish = true
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "src/**", "tests/**"]

[dependencies]
subc-os = { version = "0.1.9", features = ["tokio"] }
async-trait = "0.1"
similar = "3.1.0"
tokio = { version = "1", features = ["fs", "process", "rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
parking_lot = "0.12.5"

[target.'cfg(windows)'.dependencies]
parking_lot = "0.12.5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Storage_ProjectedFileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Enable only the fixture binary during this crate's tests. Cargo drops this
# path-only dev-dependency from the published manifest.
cortexkit-cow = { path = ".", features = ["test-support"] }

[[bin]]
name = "cortexkit-cow-spawn-fixture"
path = "tests/fixtures/spawn-trampoline.rs"
required-features = ["test-support"]

[features]
test-support = []

[lints.rust]
unsafe_code = "deny"
