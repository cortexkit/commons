[package]
name = "cortexkit-project-identity"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Transport-independent request and reply types for the project-identity module"
readme = "README.md"
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "src/**", "tests/**", "test-vectors/**"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
