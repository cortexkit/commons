[package]
name = "cortexkit-agent-identity"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Serde-only agent identity, session, fleet and context reads for the agent registry"
readme = "README.md"
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "src/**", "tests/**", "test-vectors/**"]

[dependencies]
cortexkit-project-identity = { path = "../cortexkit-project-identity", version = "0.1.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
