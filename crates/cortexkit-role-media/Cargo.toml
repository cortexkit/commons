[package]
name = "cortexkit-role-media"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Wire contract, validation helpers and vectors for media-provider/v1."
publish = true

[features]
test-vectors = []

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[test]]
name = "media_contract"
required-features = ["test-vectors"]
