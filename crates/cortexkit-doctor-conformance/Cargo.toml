[package]
name = "cortexkit-doctor-conformance"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Conformance runner for a CortexKit module's doctor commands"

[features]
test-fixture = []

[target.'cfg(unix)'.dependencies]
cortexkit-doctor = { version = "=0.3.0", path = "../cortexkit-doctor", features = ["conformance"] }
rustix = { version = "1", features = ["fs"] }
sha2 = "0.10"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bin]]
name = "cortexkit-doctor-conformance-fixture"
path = "tests/support/fixture.rs"
test = false
required-features = ["test-fixture"]
