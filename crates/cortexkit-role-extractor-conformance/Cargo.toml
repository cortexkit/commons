# cortexkit-role-extractor-conformance — the `extractor/v1` conformance
# suite. It drives a LIVE extractor module over its real management route,
# with a stand-in provider the module's own CI wires in: the suite sends
# requests the contract refuses and checks each refusal, its code and its
# field, and that the stand-in was never called; it checks what the module
# sends the stand-in for a request it admits; and it has the stand-in
# replay Clairic's captured replies and checks what the module answers. A
# module adds this crate as a dev-dependency; it is a separate crate so a
# module's production build never compiles the suite.
[package]
name = "cortexkit-role-extractor-conformance"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Conformance suite for the CortexKit extractor/v1 role: drives a live extractor module against a call-counting stand-in provider that replays Clairic's replies, and checks its admission refusals, provider requests and replies."
publish = true

[dependencies]
async-trait = "0.1"
# `test-vectors` compiles in `provider-replies.json`: the Clairic replies
# the stand-in replays.
cortexkit-role-extractor = { version = "=0.2.1", path = "../cortexkit-role-extractor", features = ["test-vectors"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
subc-protocol = "0.34"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
