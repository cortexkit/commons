[package]
name = "cortexkit-log"
version = "0.3.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Fleet logging format, filtering, redaction, and retention for CortexKit modules"

[features]
# `store-paths` supplies `Config::for_module`, `for_plugin` and `from_env`, which
# derive `<module data dir>/logs/` through cortexkit-store-types so every module
# lands its log beside its own store. It is ON by default because that is what
# a supervised module wants. A consumer that pins cortexkit-store-types at a
# DIFFERENT commons rev must turn it OFF and pass `logs_dir` itself
# (`Config::in_dir`): with it on, cargo sees two git sources for one crate and
# the consumer's lock carries two cortexkit-store-types, which is a type-identity
# hazard on the StorageDescriptor wire shape that crate owns.
default = ["store-paths"]
store-paths = ["dep:cortexkit-store-types"]

[dependencies]
cortexkit-store-types = { version = "0.2.1", path = "../cortexkit-store-types", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
