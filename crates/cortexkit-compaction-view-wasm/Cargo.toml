[package]
name = "cortexkit-compaction-view-wasm"
version = "0.1.1"
edition.workspace = true
repository.workspace = true
readme = "README.md"
description = "WebAssembly build of the compaction view library, for runners written in JavaScript."
license.workspace = true

[lib]
name = "cortexkit_compaction_view_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
cortexkit-compaction-view = { version = "0.2", path = "../cortexkit-compaction-view" }
serde_json = "1"
