# Caller-facing exec-remote/v1 values, shared by clients and executors.
# Transport framing and runner-only transfer control stay with the executor.
[package]
name = "cortexkit-exec-remote-types"
version = "0.2.12"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Caller-facing types and golden vectors for the CortexKit exec-remote/v1 capability."
readme = "README.md"
publish = true
include = ["Cargo.toml", "README.md", "CONTRACT.md", "CHANGELOG.md", "src/**", "tests/**", "test-vectors/**"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", default-features = false, features = ["serde"] }

[dev-dependencies]
serde_json = "1"
serde_json_canonicalizer = "0.3"
