[package]
name = "cortexkit-rich-ui-syntax"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "src/**", "tests/**", "test-vectors/**"]
description = "Bounded rich UI language parser and syntax-tree-derived tool output reference scanner"
keywords = ["parser", "markdown", "rich-ui", "references"]
categories = ["parser-implementations", "text-processing"]

[features]
# Compiles the published reference-scanning vectors into the public `vectors` module.
test-vectors = []

[dependencies]
pulldown-cmark = { version = "=0.13.0", default-features = false }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"

[[test]]
name = "vectors_feature"
required-features = ["test-vectors"]
