[package]
name = "cortexkit-role-user-commands"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Wire contract and pure validators for user-commands/v1."
publish = true
include = ["Cargo.toml", "CONTRACT.md", "README.md", "CHANGELOG.md", "src/**", "tests/**", "test-vectors/**"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = { version = "0.2", optional = true }
sha2 = { version = "0.10", optional = true }
subc-protocol = ">=0.34.1, <0.37"

[features]
default = ["digest"]
# The describe digest. serde_jcs turns on serde_json's `float_roundtrip` in any
# build that includes it, so a reader that only decodes app-side types can turn
# default features off and leave the digest out.
digest = ["dep:serde_jcs", "dep:sha2"]

[[test]]
name = "validators"
required-features = ["digest"]

[[test]]
name = "vectors"
required-features = ["digest"]
