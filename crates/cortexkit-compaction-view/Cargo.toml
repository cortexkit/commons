[package]
name = "cortexkit-compaction-view"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
readme = "README.md"
description = "The view library of the CortexKit compaction contract: how a runner renders a view and checks it, shared by runners and compaction providers so they never compute it differently."
license.workspace = true

[lib]
name = "cortexkit_compaction_view"

[dependencies]
cortexkit-role-compaction = { version = "0.2", path = "../cortexkit-role-compaction" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
