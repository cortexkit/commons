# cortexkit-role-llm-runner — the wire contract of the `llm-runner/v1` role:
# role.describe and its capability groups, the transcript reads, run results,
# the subscription handoff, owner sends with a delivery mode, the session
# baseline, error codes, the kill-point vocabulary its crash suite will use,
# and CONTRACT.md, which says what is pinned and what is still open. Pure
# serde plus small checks; no transport, no runtime.
#
# The conformance runner is a sibling `-conformance` crate, so a runner's
# production build never pulls in the suite.
[package]
name = "cortexkit-role-llm-runner"
version = "0.5.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Wire contract of the CortexKit llm-runner/v1 role: role.describe, transcript reads, run results, subscriptions, owner sends and the session baseline."
publish = true

[features]
# Compiles the vectors in this crate's `test-vectors/llm-runner-v1/` into the
# crate as the public `vectors` module.
test-vectors = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
cortexkit-rich-ui-syntax = "0.1.1"

[dev-dependencies]
cortexkit-rich-ui-syntax = { version = "0.1.1", features = ["test-vectors"] }
cortexkit-role-tool-provider = { version = "0.10.3", path = "../cortexkit-role-tool-provider", features = ["test-vectors"] }

[[test]]
name = "vectors_feature"
required-features = ["test-vectors"]
