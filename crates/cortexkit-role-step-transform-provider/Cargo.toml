# cortexkit-role-step-transform-provider — the wire contract of the
# `step-transform-provider/v1` role: role.describe, the declaration that
# bounds what a plan may subscribe to, the four hooks (pre_user,
# post_assistant, pre_tool in its mutate, validate and approve phases,
# post_tool) and their answers, error codes, the kill-point vocabulary its
# crash suite will use, and CONTRACT.md, which states every rule as pinned.
# Pure serde plus small checks; no transport, no runtime.
#
# These production wire types do not depend on a conformance harness or suite.
[package]
name = "cortexkit-role-step-transform-provider"
version = "0.3.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Wire contract of the CortexKit step-transform-provider/v1 role: the subscription declaration, the four hooks, their operations and the PreTool phases."
publish = true

[features]
test-vectors = []

[[test]]
name = "vectors_feature"
required-features = ["test-vectors"]

[dependencies]
# The runner role's crate, for the names and types both sides of the
# interface share, so they cannot drift apart.
cortexkit-role-llm-runner = { version = "0.4.0", path = "../cortexkit-role-llm-runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Compare is_valid_capability_identifier with subc-protocol's checker in tests,
# without adding a production dependency.
subc-protocol = "0.32.0"
