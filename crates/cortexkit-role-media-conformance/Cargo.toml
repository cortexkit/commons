[package]
name = "cortexkit-role-media-conformance"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Scripted conformance checks for the CortexKit media-provider/v1 role."

[dependencies]
async-trait = "0.1"
base64 = "0.22"
cortexkit-role-media = { version = "=0.1.2", path = "../cortexkit-role-media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
