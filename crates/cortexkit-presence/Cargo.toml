[package]
name = "cortexkit-presence"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pure presence summaries and notification routing: where the person is, and whether an item goes to the desktop, the phone or nowhere."
publish = true
include = ["Cargo.toml", "CHANGELOG.md", "README.md", "src/**"]

[dependencies]
serde = { version = "1", features = ["derive"] }
