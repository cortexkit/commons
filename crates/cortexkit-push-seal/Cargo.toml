[package]
name = "cortexkit-push-seal"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Seals push-notification payloads with HPKE so only the recipient device can read them."

# Deliberately unpublished. The hazard is NOT that no external consumer exists —
# that reasoning invites publication the day one appears. Publishing creates a
# SECOND distribution path to the same bytes: a consumer resolving a registry
# version while a sibling checkout floats to different code, compiling both into
# one binary. For a crate emitting a wire format that is a silent divergence
# between sealer and opener, not a build error.
publish = false

[dependencies]
sha2 = "0.10"
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
rand_core = "0.9"

[dev-dependencies]
hex = "0.4"
