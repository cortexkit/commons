name: CI

on:
  push:
    branches: [master, 'train/**']
  pull_request:
  # Reusable so release.yml gates publish on the exact same matrix —
  # release-time and PR-time CI can never drift.
  workflow_call:

concurrency:
  # Release commits must finish independently; PRs and training refs still supersede older runs.
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cross-platform matrix is deliberate: cortexkit-paths carries cfg(windows)
  # canonicalization (verbatim \\?\ + UNC strip, drive-letter uppercasing) that
  # only compiles/runs on Windows. Running the matrix on every push validates
  # those Windows vectors continuously, instead of relying on a manual
  # native-Windows check before each release.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.os == 'ubuntu-latest' && 'x86_64-pc-windows-gnu,wasm32-unknown-unknown' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install Windows cross-compiler
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      # A fresh runner must populate its cache before the offline lockfile check.
      - name: Populate Cargo cache
        run: cargo fetch --locked

      - name: Fast gate
        shell: bash
        env:
          GATE_CI_OS: ${{ matrix.os }}
        run: scripts/gate.sh fast

      - name: Clippy
        shell: bash
        env:
          GATE_CI_OS: ${{ matrix.os }}
        run: scripts/gate.sh lint

      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 'lts/*'

      - name: Test compaction view WebAssembly and JavaScript loader
        if: matrix.os == 'ubuntu-latest'
        run: bash crates/cortexkit-compaction-view-wasm/build.sh

      # One OS proves broker semantics; macOS and Windows keep skipping live
      # NATS tests when no server is installed.
      - name: Install pinned NATS server
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nats-server-v2.15.0-linux-amd64.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/nats-io/nats-server/releases/download/v2.15.0/nats-server-v2.15.0-linux-amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '5d2c51caca950333aba84911df7d377f826f3a59ec36061c6539105084f65c92' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "CK_NATS_SERVER_BIN=$RUNNER_TEMP/nats-server-v2.15.0-linux-amd64/nats-server" >> "$GITHUB_ENV"
          echo 'CK_REQUIRE_NATS_SERVER=1' >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace --all-targets --locked

      # Feature-gated vector tests do not run under the plain workspace test above.
      - name: Test shipped vector features
        run: cargo test --locked -p cortexkit-role-agent-data -p cortexkit-role-compaction-provider -p cortexkit-role-step-transform-provider -p cortexkit-role-llm-runner@0.8 -p cortexkit-role-tool-provider -p cortexkit-anthropic-policy -p cortexkit-chatgpt-policy -p cortexkit-role-agent-inbox -p cortexkit-role-classifier -p cortexkit-role-routing -p cortexkit-model-batch -p cortexkit-role-extractor -p cortexkit-rich-ui-syntax -p cortexkit-llm-tools -p cortexkit-role-media --features test-vectors

  # cortexkit-store-postgres's live tests need a real postgres. GitHub service
  # containers are Linux-only, so they run here (the cross-OS matrix above skips
  # them: no DSN -> skip-pass, which is correct on macOS/Windows). CORTEXKIT_REQUIRE_PG
  # makes a missing DSN FAIL here instead of silently skip-passing, so a broken
  # service wiring can never show a false green.
  postgres:
    name: Postgres backend (live)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ck
          POSTGRES_PASSWORD: ckpw
          POSTGRES_DB: ckstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ck -d ckstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Test cortexkit-store-postgres (live)
        env:
          CORTEXKIT_TEST_PG_DSN: postgresql://ck:ckpw@127.0.0.1:5432/ckstore
          CORTEXKIT_REQUIRE_PG: "1"
        run: cargo test -p cortexkit-store-postgres --locked -- --nocapture
