name: Release

# Per-crate release. Tag format: `<crate>-v<version>` (e.g. cortexkit-paths-v0.1.1).
# Each crate in the workspace versions and publishes independently.
on:
  push:
    tags:
      - "*-v*"

concurrency:
  # Include SHA so a retag at a different commit gets its own group and
  # won't block behind a stuck queued run.
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A successful master push run proves this exact commit already passed CI, so
  # release tags do not need to repeat the same cross-platform checks.
  check_ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      green: ${{ steps.check.outputs.green }}
    steps:
      - name: Check for successful master CI run
        id: check
        run: |
          green=false
          # There is no checkout here, so gh takes the repository from GH_REPO.
          # If gh cannot answer, say so: the full verify then runs, which is safe
          # but slow, and a silent fallback would hide a broken check.
          if ! runs=$(gh run list \
            --workflow CI \
            --commit "$GITHUB_SHA" \
            --branch master \
            --event push \
            --json conclusion,event,headBranch 2>&1); then
            echo "::warning::could not read CI runs for $GITHUB_SHA, so the full verify runs: $runs"
            runs='[]'
          fi
          if jq -e 'any(.[]; .event == "push" and .headBranch == "master" and .conclusion == "success")' <<<"$runs" >/dev/null; then
            green=true
          fi
          echo "green=$green" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Same 3-OS fmt/clippy/test matrix as PR-time CI. Reused (not copied) so a
  # release can never ship code that wouldn't pass CI — including the
  # Windows-only cfg(windows) canonicalization vectors.
  verify:
    if: needs.check_ci.outputs.green != 'true'
    needs: check_ci
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [check_ci, verify]
    if: ${{ !cancelled() && (needs.check_ci.outputs.green == 'true' || needs.verify.result == 'success') }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Parse `<crate>-v<version>` from the tag and assert the crate's
      # Cargo.toml version matches — guards against tagging a stale version.
      - name: Resolve crate + version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^(.+)-v([0-9].*)$ ]]; then
            echo "::error::Tag '$TAG' must be '<crate>-v<version>', e.g. cortexkit-paths-v0.1.1"
            exit 1
          fi
          CRATE="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"
          MANIFEST="crates/${CRATE}/Cargo.toml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::No crate '${CRATE}' at ${MANIFEST}"
            exit 1
          fi
          CARGO_VERSION=$(grep '^version' "$MANIFEST" | head -1 | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag wants ${VERSION} but ${MANIFEST} has ${CARGO_VERSION}"
            exit 1
          fi
          echo "crate=$CRATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing ${CRATE} v${VERSION}"

      # Idempotent: a retag of the same version (recovery re-run) treats
      # "already exists" as success instead of failing the release.
      - name: Publish
        run: |
          CRATE="${{ steps.tag.outputs.crate }}"
          cargo publish --package "$CRATE" \
            || { ec=$?; cargo publish --package "$CRATE" --dry-run 2>&1 | grep -q "already exists" && echo "already published; treating as success" || exit $ec; }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
